<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman Spiel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Sanfte Animationen für UI-Elemente */
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 font-sans selection:bg-cyan-500 selection:text-slate-950">

    <header class="text-center my-6">
        <h1 class="text-5xl md:text-6xl font-extrabold tracking-wider bg-gradient-to-r from-cyan-400 via-teal-400 to-emerald-400 bg-clip-text text-transparent drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)]">
            HANGMAN
        </h1>
        <p class="text-slate-400 mt-2 text-sm md:text-base tracking-wide uppercase">Das klassische Galgenmännchen-Spiel</p>
    </header>

    <main class="w-full max-w-4xl bg-slate-800/50 backdrop-blur-md rounded-2xl border border-slate-700/60 p-6 md:p-8 shadow-2xl flex flex-col lg:flex-row gap-8 items-center lg:items-stretch justify-center">
        
        <!-- Linke Seite: Visualisierung (Galgen) -->
        <div class="w-full max-w-[320px] flex flex-col items-center justify-center bg-slate-950/40 rounded-xl p-4 border border-slate-800">
            <svg id="hangman-svg" viewBox="0 0 200 220" class="w-full h-auto stroke-cyan-400 stroke-[3.5] stroke-linecap-round stroke-linejoin-round fill-none drop-shadow-[0_0_8px_rgba(34,211,238,0.3)]">
                <!-- 15 Segmente für 15 Striche -->
                <!-- Unterer Balken / Basis (Striche 1, 2, 3) -->
                <line id="line-1" x1="20" y1="200" x2="60" y2="200" class="opacity-10 stroke-slate-700" />
                <line id="line-2" x1="60" y1="200" x2="100" y2="200" class="opacity-10 stroke-slate-700" />
                <line id="line-3" x1="100" y1="200" x2="140" y2="200" class="opacity-10 stroke-slate-700" />
                
                <!-- Senkrechter Stamm (Striche 4, 5, 6, 7) -->
                <line id="line-4" x1="40" y1="200" x2="40" y2="160" class="opacity-10 stroke-slate-700" />
                <line id="line-5" x1="40" y1="160" x2="40" y2="120" class="opacity-10 stroke-slate-700" />
                <line id="line-6" x1="40" y1="120" x2="40" y2="70" class="opacity-10 stroke-slate-700" />
                <line id="line-7" x1="40" y1="70" x2="40" y2="20" class="opacity-10 stroke-slate-700" />
                
                <!-- Querbalken oben (Striche 8, 9) -->
                <line id="line-8" x1="40" y1="20" x2="90" y2="20" class="opacity-10 stroke-slate-700" />
                <line id="line-9" x1="90" y1="20" x2="130" y2="20" class="opacity-10 stroke-slate-700" />
                
                <!-- Schräge Stütze & Seil (Striche 10, 11) -->
                <line id="line-10" x1="40" y1="50" x2="70" y2="20" class="opacity-10 stroke-slate-700" />
                <line id="line-11" x1="130" y1="20" x2="130" y2="50" class="opacity-10 stroke-slate-700" />
                
                <!-- Männchen: Kopf (Strich 12) -->
                <circle id="line-12" cx="130" cy="65" r="15" class="opacity-10 stroke-slate-700" />
                
                <!-- Männchen: Körper (Strich 13) -->
                <line id="line-13" x1="130" y1="80" x2="130" y2="130" class="opacity-10 stroke-slate-700" />
                
                <!-- Männchen: Arme (Strich 14 - beide zusammengefasst als ein Schritt) -->
                <path id="line-14" d="M 110 95 L 130 90 L 150 95" class="opacity-10 stroke-slate-700" />
                
                <!-- Männchen: Beine (Strich 15 - beide zusammengefasst als finaler Schritt) -->
                <path id="line-15" d="M 115 160 L 130 130 L 145 160" class="opacity-10 stroke-slate-700" />
            </svg>
            <div class="mt-4 text-xs font-semibold tracking-wider text-slate-500 uppercase">
                Fehler: <span id="error-counter" class="text-cyan-400 font-mono text-sm">0</span> / 15
            </div>
        </div>

        <!-- Rechte Seite: Interaktionsbereich -->
        <div class="flex-1 w-full flex flex-col justify-between min-h-[300px]">
            
            <!-- Phase 1: Wort-Eingabe (Setup) -->
            <div id="setup-area" class="space-y-4 my-auto fade-in">
                <div class="text-center lg:text-left">
                    <h2 class="text-xl font-bold text-slate-200">Spiel vorbereiten</h2>
                    <p class="text-slate-400 text-sm mt-1">Gib ein geheimes Suchwort ein, das erraten werden soll.</p>
                </div>
                <div class="flex flex-col sm:flex-row gap-2">
                    <input type="password" id="word-input" placeholder="Geheimwort eintippen..." 
                        class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-500 font-mono tracking-widest text-lg transition-colors" />
                    <button id="start-btn" 
                        class="bg-gradient-to-r from-cyan-500 to-teal-500 hover:from-cyan-400 hover:to-teal-400 text-slate-950 font-bold px-6 py-3 rounded-xl transition-all shadow-lg shadow-cyan-500/20 active:scale-98">
                        Spiel starten
                    </button>
                </div>
                <p id="setup-error" class="text-rose-400 text-xs font-medium hidden">Bitte gib ein gültiges Wort ein (nur Buchstaben).</p>
            </div>

            <!-- Phase 2: Hauptspiel (Aktiv) -->
            <div id="game-area" class="space-y-6 hidden flex-col justify-between h-full fade-in">
                
                <!-- Anzeige des gesuchten Wortes -->
                <div class="text-center py-4 bg-slate-950/20 rounded-xl border border-slate-800/40 min-h-[80px] flex items-center justify-center">
                    <div id="word-display" class="flex flex-wrap justify-center gap-3 font-mono text-3xl md:text-4xl font-extrabold tracking-widest text-cyan-400">
                        <!-- Wird dynamisch befüllt -->
                    </div>
                </div>

                <!-- Buchstaben-Tastatur -->
                <div class="space-y-2">
                    <p class="text-xs font-semibold uppercase tracking-wider text-slate-500 text-center lg:text-left">Wähle einen Buchstaben:</p>
                    <div id="keyboard" class="grid grid-cols-7 sm:grid-cols-9 gap-1.5 md:gap-2">
                        <!-- Wird dynamisch befüllt -->
                    </div>
                </div>

                <!-- Status & Reset -->
                <div class="flex flex-col sm:flex-row items-center justify-between pt-4 border-t border-slate-700/40 gap-4">
                    <div id="game-status" class="text-base font-medium tracking-wide text-slate-300 text-center sm:text-left">
                        Errate das gesuchte Wort!
                    </div>
                    <button id="reset-btn" 
                        class="w-full sm:w-auto border border-slate-600 hover:border-slate-400 hover:bg-slate-700/30 text-slate-300 font-semibold px-5 py-2.5 rounded-xl transition-all text-sm">
                        Neues Spiel
                    </button>
                </div>

            </div>
        </div>
    </main>

    <footer class="text-center text-xs text-slate-600 my-4 tracking-wide">
        Entwickelt mit Tailwind CSS & JavaScript
    </footer>

    <script>
        // Spielvariablen
        let secretWord = "";
        let guessedLetters = new Set();
        let wrongAttempts = 0;
        const maxAttempts = 15;

        // DOM Elemente
        const setupArea = document.getElementById('setup-area');
        const gameArea = document.getElementById('game-area');
        const wordInput = document.getElementById('word-input');
        const startBtn = document.getElementById('start-btn');
        const setupError = document.getElementById('setup-error');
        const wordDisplay = document.getElementById('word-display');
        const keyboard = document.getElementById('keyboard');
        const gameStatus = document.getElementById('game-status');
        const resetBtn = document.getElementById('reset-btn');
        const errorCounter = document.getElementById('error-counter');

        // Event Listener für Setup
        startBtn.addEventListener('click', startGame);
        wordInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') startGame(); });
        resetBtn.addEventListener('click', resetGame);

        function startGame() {
            const rawWord = wordInput.value.trim().toUpperCase();
            
            // Validierung: Nur Buchstaben zulassen
            if (!rawWord || !/^[A-ZÄÖÜß]+$/.test(rawWord)) {
                setupError.classList.remove('hidden');
                return;
            }
            
            setupError.classList.add('hidden');
            secretWord = rawWord;
            guessedLetters.clear();
            wrongAttempts = 0;
            
            // UI umschalten
            setupArea.classList.add('hidden');
            gameArea.classList.remove('hidden');
            gameArea.classList.add('flex');
            
            updateDisplay();
            buildKeyboard();
            resetSvg();
        }

        function updateDisplay() {
            // Wort-Anzeige generieren
            wordDisplay.innerHTML = "";
            let wordComplete = true;

            for (let char of secretWord) {
                const letterBox = document.createElement('span');
                letterBox.className = "inline-block min-w-[1.5rem] text-center border-b-4 border-slate-600 pb-1";
                
                if (guessedLetters.has(char)) {
                    letterBox.textContent = char;
                    letterBox.classList.remove('border-slate-600');
                    letterBox.classList.add('border-cyan-400', 'text-cyan-400', 'fade-in');
                } else {
                    letterBox.textContent = "_";
                    wordComplete = false;
                }
                wordDisplay.appendChild(letterBox);
            }

            // Fehler-Counter updaten
            errorCounter.textContent = wrongAttempts;

            // Spiel-Ende Bedingungen prüfen
            if (wordComplete) {
                endGame(true);
            } else if (wrongAttempts >= maxAttempts) {
                endGame(false);
            }
        }

        function buildKeyboard() {
            keyboard.innerHTML = "";
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜß".split("");

            alphabet.forEach(letter => {
                const btn = document.createElement('button');
                btn.textContent = letter;
                btn.className = "bg-slate-700 hover:bg-slate-600 text-slate-100 font-bold py-2 rounded-lg transition-all text-sm active:scale-95 border border-slate-600/40";
                
                btn.addEventListener('click', () => handleGuess(letter, btn));
                keyboard.appendChild(btn);
            });
        }

        function handleGuess(letter, buttonElement) {
            if (guessedLetters.has(letter) || wrongAttempts >= maxAttempts) return;

            guessedLetters.add(letter);
            buttonElement.disabled = true;

            if (secretWord.includes(letter)) {
                // Richtig geraten
                buttonElement.className = "bg-emerald-950 text-emerald-400 border border-emerald-500/40 font-bold py-2 rounded-lg cursor-not-allowed opacity-80 text-sm";
            } else {
                // Falsch geraten
                wrongAttempts++;
                buttonElement.className = "bg-rose-950 text-rose-400 border border-rose-500/40 font-bold py-2 rounded-lg cursor-not-allowed opacity-50 text-sm";
                drawNextStroke();
            }

            updateDisplay();
        }

        function drawNextStroke() {
            if (wrongAttempts <= maxAttempts) {
                const line = document.getElementById(`line-${wrongAttempts}`);
                if (line) {
                    line.classList.remove('opacity-10', 'stroke-slate-700');
                    line.classList.add('opacity-100', 'stroke-cyan-400');
                }
            }
        }

        function resetSvg() {
            for (let i = 1; i <= maxAttempts; i++) {
                const line = document.getElementById(`line-${i}`);
                if (line) {
                    line.className = "opacity-10 stroke-slate-700";
                }
            }
        }

        function endGame(isWin) {
            // Deaktiviere alle verbleibenden Keyboard-Buttons
            const buttons = keyboard.getElementsByTagName('button');
            for (let btn of buttons) {
                btn.disabled = true;
            }

            if (isWin) {
                gameStatus.innerHTML = "🎉 <span class='text-emerald-400 font-bold'>Gewonnen!</span> Du hast das Wort erraten.";
                // Highlight das komplette Wort in grün
                wordDisplay.querySelectorAll('span').forEach(s => s.className = "inline-block min-w-[1.5rem] text-center border-b-4 border-emerald-400 pb-1 text-emerald-400 font-extrabold");
            } else {
                gameStatus.innerHTML = "💥 <span class='text-rose-400 font-bold'>Verloren!</span> Das Wort war: <span class='font-mono font-bold text-white'>" + secretWord + "</span>";
                // Zeige das richtige Wort
                wordDisplay.innerHTML = "";
                for (let char of secretWord) {
                    const letterBox = document.createElement('span');
                    letterBox.className = "inline-block min-w-[1.5rem] text-center border-b-4 border-rose-500 pb-1 text-rose-400";
                    letterBox.textContent = char;
                    wordDisplay.appendChild(letterBox);
                }
            }
        }

        function resetGame() {
            wordInput.value = "";
            gameArea.classList.remove('flex');
            gameArea.classList.add('hidden');
            setupArea.classList.remove('hidden');
            gameStatus.innerHTML = "Errate das gesuchte Wort!";
            setupError.classList.add('hidden');
        }
    </script>
</body>
</html>
